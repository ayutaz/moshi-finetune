name: Code Quality

on: [ push, pull_request ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Lint code with Ruff
        run: ruff check --output-format=github .

      - name: Format code with Ruff
        run: ruff format --check .

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      # The suite covers the experiment data gates and the pure helpers, none of which
      # import torch, so it runs without the training dependencies. Checks that need the
      # non-redistributable raw audio skip themselves when it is absent.
      #
      # `python -m pytest` rather than `pytest`: the tests import `tools` and `models` from
      # the repository root, and only the module form puts the working directory on sys.path.
      - name: Run tests
        run: python -m pytest tests -q
